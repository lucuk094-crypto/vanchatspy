# ─────────────────────────────────────────────────────────────────────
# Van Chat.SPY di VPS/server sendiri (Docker)
#   cp .env.example .env      (isi AI_API_KEY = kunci NaraRouter)
#   docker compose up -d      → web: http://<ip-vps>:8131
#
# Penyedia AI-nya NaraRouter (alamat publik), jadi cukup satu layanan —
# tidak ada router lokal yang perlu dijalankan di dalam server ini.
# ─────────────────────────────────────────────────────────────────────
services:
  web:
    build: .
    container_name: van-chat-spy
    restart: unless-stopped
    environment:
      PORT: 8131
      AI_PROVIDER: bynara
      AI_API_KEY: ${AI_API_KEY:-}
      # opsional: pilih model per mode
      # AI_MODEL_FAST: agnes-2.5-flash
      # AI_MODEL_THINK: agnes-3-flash
      # AI_MODEL_VISI: gemini-3.8-flash-high
    ports:
      - "8131:8131"
